<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Marketplace Helper primary app icon</title>
  <desc id="desc">A blue app icon with a white marketplace helper connection mark and MH initials.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5cff"/>
      <stop offset="1" stop-color="#07358f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#061d50" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="411" cy="89" r="92" fill="#2d8cff" opacity=".22"/>
  <circle cx="86" cy="445" r="130" fill="#061d50" opacity=".18"/>
  <g filter="url(#shadow)">
    <path d="M112 191 L195 145 L293 201 L392 145" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
    <circle cx="112" cy="191" r="25" fill="#ffffff"/>
    <circle cx="195" cy="145" r="25" fill="#b9dcff"/>
    <circle cx="293" cy="201" r="25" fill="#ffffff"/>
    <circle cx="392" cy="145" r="25" fill="#b9dcff"/>
    <rect x="92" y="245" width="328" height="138" rx="38" fill="#ffffff"/>
  </g>
  <text x="256" y="342" text-anchor="middle" fill="#102a43" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="800" letter-spacing="-8">MH</text>
</svg>
