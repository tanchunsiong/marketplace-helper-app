<svg xmlns="http://www.w3.org/2000/svg" width="1824" height="176" viewBox="0 0 1824 176" role="img" aria-labelledby="title desc">
  <title id="title">Marketplace Helper cover image</title>
  <desc id="desc">An abstract blue network and marketplace cover image with minimal text-free composition.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182b"/>
      <stop offset=".45" stop-color="#0b3d91"/>
      <stop offset="1" stop-color="#0b5cff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
